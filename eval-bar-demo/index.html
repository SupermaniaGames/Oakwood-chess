<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Chess Eval Bar Demo (chess.js + Stockfish WASM)</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrap">
    <h1>Live Evaluation Bar</h1>
    <p class="sub">chess.js for the board/rules, Stockfish compiled to WebAssembly running in a Web Worker — no server involved.</p>

    <div class="stage">
      <div class="board-frame">
        <div class="eval-gauge">
          <div class="eval-gauge-track">
            <div class="eval-gauge-fill" id="eval-fill"></div>
            <span class="eval-gauge-icon">✓</span>
            <span class="eval-gauge-score" id="eval-score">0.0</span>
          </div>
          <div class="eval-gauge-caption" id="depth-indicator">Stockfish (WASM) · depth 0</div>
        </div>
        <div id="board" class="board"></div>
      </div>
    </div>

    <div class="status-row">
      <span id="status">White to move.</span>
    </div>

    <button id="btn-reset" class="btn">Reset board</button>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
